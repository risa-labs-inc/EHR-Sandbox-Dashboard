name: Deploy to Firebase Hosting (prod)

# Auto-deploys the dashboard to https://ehr-sandbox.web.app whenever main is updated.
# The site is a Flask app frozen to static HTML by freeze.py, then served by Firebase Hosting.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: firebase-hosting-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build static site (freeze Flask -> public/)
        run: python freeze.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project rapids-platform --non-interactive
